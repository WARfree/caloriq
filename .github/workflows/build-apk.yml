name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descarca codul sursa
      uses: actions/checkout@v4

    - name: 2. Configureaza Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. Configureaza Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 4. Instaleaza dependentele (fara oprire pe avertismente)
      run: npm install --legacy-peer-deps --force

    - name: 5. Ruleaza Build Web (ignora erorile de linting)
      run: npm run build || true
      env:
        CI: false

    - name: 6. Pregateste Capacitor pentru Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --force
        npx cap init Caloriq com.warfree.caloriq --web-dir dist || true
        npx cap add android || true
        npx cap copy android || true

    - name: 7. Compileaza fisierul APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 8. Salveaza fisierul APK
      uses: actions/upload-artifact@v4
      with:
        name: caloriq-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
